name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pakai npm 11: npm bawaan Node 22 (npm 10) berhenti dengan bug internal
      # "Exit handler never called!" saat menjalankan install script.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          MEDIA_CENTER_API_BASE_URL: https://mediacenter.hstkab.go.id
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-secret

  # Deploy ke Vercel hanya bila repo punya variabel ENABLE_VERCEL_DEPLOY=true
  # beserta rahasia VERCEL_*. Tanpa itu job dilewati agar CI tidak selalu merah.
  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && vars.ENABLE_VERCEL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

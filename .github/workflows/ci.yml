name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push berturut-turut ke branch yang sama membatalkan run lama,
# supaya commit terbaru tidak mengantre di belakang build usang.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Satu sumber kebenaran: pnpm-lock.yaml. Versi pnpm dipin di sini
      # (bukan lewat field packageManager) agar tidak ada dua sumber versi.
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      # cache: pnpm harus diletakkan setelah pnpm terpasang.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: gagal cepat bila pnpm-lock.yaml tidak sinkron
      # dengan package.json (pengganti pemeriksaan "npm ci").
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
        env:
          MEDIA_CENTER_API_BASE_URL: https://mediacenter.hstkab.go.id
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-secret

  # Deploy ke Vercel hanya bila repo punya variabel ENABLE_VERCEL_DEPLOY=true
  # beserta rahasia VERCEL_*. Tanpa itu job dilewati agar CI tidak selalu merah.
  deploy:
    needs: quality
    if: github.ref == 'refs/heads/main' && vars.ENABLE_VERCEL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
